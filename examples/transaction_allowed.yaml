    owner: "leela@corp.ae"
    classification: "internal"
    excerpt: "Thursday - quarterly review with finance"
  - source: "sharepoint"
    owner: "leela@corp.ae"
    classification: "internal"
    excerpt: "Q3 review pack"
model:
  name: "gpt-4o-mini"
  provider: "azure_openai"
  deployment: "prod-uae"
  region: "uae-north"
response: "You have four meetings. Only Thursday's quarterly review needs preparation."
record_count: 4
