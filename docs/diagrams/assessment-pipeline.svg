<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 534" width="980" height="534" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Muraqib assessment pipeline: six nodes, a model at only two of them">
  <rect width="980" height="534" fill="#fbfbfd"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa0b4"/></marker></defs>
  <text x="32" y="44" font-size="21" font-weight="700" fill="#16161d">Assessment pipeline — a graph, not an autonomous loop</text>
  <text x="32" y="68" font-size="13.5" fill="#5b5b6b">Six nodes, declared order, declared preconditions, checkpoint after every node. Reproducible, bounded, resumable.</text>

  <!-- inputs -->
  <rect x="32" y="100" width="132" height="72" rx="8" fill="#eef0f6" stroke="#c9cddb"/>
  <text x="98" y="126" font-size="12.5" font-weight="600" text-anchor="middle" fill="#16161d">platform config</text>
  <text x="98" y="145" font-size="10.5" text-anchor="middle" fill="#6b6b7b">what it touches,</text>
  <text x="98" y="159" font-size="10.5" text-anchor="middle" fill="#6b6b7b">runs, evidences</text>
  <text x="98" y="188" font-size="10" text-anchor="middle" fill="#b4342f" font-weight="600">treated as untrusted</text>

  <!-- nodes -->
  <g>
    <rect x="196" y="100" width="112" height="56" rx="8" fill="#fff" stroke="#c9cddb"/><text x="252" y="124" font-size="12.5" font-weight="600" text-anchor="middle" fill="#16161d">intake</text><text x="252" y="141" font-size="10" text-anchor="middle" fill="#6b6b7b">rule</text>
    <rect x="330" y="100" width="112" height="56" rx="8" fill="#fff" stroke="#c9cddb"/><text x="386" y="124" font-size="12.5" font-weight="600" text-anchor="middle" fill="#16161d">risk</text><text x="386" y="141" font-size="10" text-anchor="middle" fill="#6b6b7b">rule · 4 tiers</text>
    <rect x="464" y="100" width="112" height="56" rx="8" fill="#fff" stroke="#c9cddb"/><text x="520" y="124" font-size="12.5" font-weight="600" text-anchor="middle" fill="#16161d">retrieval</text><text x="520" y="141" font-size="10" text-anchor="middle" fill="#6b6b7b">BM25 + dense</text>
    <rect x="598" y="100" width="112" height="56" rx="8" fill="#efe9fb" stroke="#b9a9e8"/><text x="654" y="124" font-size="12.5" font-weight="600" text-anchor="middle" fill="#3d3475">assessor</text><text x="654" y="141" font-size="10" text-anchor="middle" fill="#6a5fa0">MODEL</text>
    <rect x="732" y="100" width="112" height="56" rx="8" fill="#efe9fb" stroke="#b9a9e8"/><text x="788" y="124" font-size="12.5" font-weight="600" text-anchor="middle" fill="#3d3475">critic</text><text x="788" y="141" font-size="10" text-anchor="middle" fill="#6a5fa0">MODEL</text>
    <rect x="866" y="100" width="82" height="56" rx="8" fill="#fff" stroke="#c9cddb"/><text x="907" y="124" font-size="12.5" font-weight="600" text-anchor="middle" fill="#16161d">reporter</text><text x="907" y="141" font-size="10" text-anchor="middle" fill="#6b6b7b">rule</text>
  </g>
  <g stroke="#9aa0b4" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M164 128h26"/><path d="M308 128h16"/><path d="M442 128h16"/><path d="M576 128h16"/><path d="M710 128h16"/><path d="M844 128h16"/>
  </g>

  <text x="948" y="182" font-size="11" fill="#6a5fa0" font-weight="600" text-anchor="end">A model is used at exactly two nodes. Everywhere else, a rule will do.</text>

  <!-- corpus -->
  <rect x="32" y="212" width="440" height="96" rx="8" fill="#fff" stroke="#dcdfe8"/>
  <text x="52" y="236" font-size="13" font-weight="700" fill="#16161d">Corpus — 121 controls, 8 instruments</text>
  <text x="52" y="257" font-size="11.5" fill="#5b5b6b">NDMO 40 · SDAIA 17 · GDPR 14 · EU AI Act 13 · NIST AI RMF 12</text>
  <text x="52" y="274" font-size="11.5" fill="#5b5b6b">KSA PDPL 10 · ISO/IEC 42001 8 · UAE PDPL 7</text>
  <text x="52" y="295" font-size="10.2" fill="#8a8a99">No verbatim regulatory text is redistributed.</text>

  <!-- guardrails -->
  <rect x="492" y="212" width="456" height="96" rx="8" fill="#fdf6ec" stroke="#e6cfa8"/>
  <text x="512" y="236" font-size="13" font-weight="700" fill="#6b4c14">Untrusted input is an attack surface</text>
  <text x="512" y="257" font-size="11.5" fill="#7a5c22">1 detect · 2 neutralise · 3 constrain to schema · 4 record</text>
  <text x="512" y="278" font-size="11" fill="#7a5c22">Every finding must cite a control that was actually retrieved, so even a</text>
  <text x="512" y="294" font-size="11" fill="#7a5c22">fully successful injection cannot invent a control that is not in the corpus.</text>

  <!-- outputs -->
  <rect x="32" y="332" width="916" height="80" rx="8" fill="#f2f0fb" stroke="#cdc6ee"/>
  <text x="52" y="356" font-size="13" font-weight="700" fill="#3d3475">Two numbers that are not the same number</text>
  <text x="52" y="377" font-size="11.5" fill="#5a5285"><tspan font-weight="600">Coverage</tspan> — what fraction of controls the evidence answers.  <tspan font-weight="600">Assurance</tspan> — what fraction is backed by evidence strong enough to stand behind.</text>
  <text x="52" y="397" font-size="11.5" fill="#5a5285">Six evidence maturity levels, from <tspan font-family="ui-monospace,monospace">runtime_verified</tspan> down to <tspan font-family="ui-monospace,monospace">none</tspan>. A policy PDF does not score what production telemetry scores.</text>

  <!-- critic -->
  <rect x="32" y="432" width="916" height="74" rx="8" fill="#eaf4ee" stroke="#a9cfba"/>
  <text x="52" y="456" font-size="13" font-weight="700" fill="#1f5c39">The critic can only lower a verdict, never raise it</text>
  <text x="52" y="475" font-size="11.5" fill="#2d6b48">A finding whose citation cannot be traced is downgraded to NOT_ASSESSABLE. Hallucinating reduces the score.</text>
  <text x="52" y="492" font-size="11.5" fill="#2d6b48">The evaluation harness measures the over-claim rate and CI fails the build at anything above 0%.</text>
</svg>
