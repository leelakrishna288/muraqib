[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muraqib"
version = "1.0.0"
description = "Muraqib - an agentic AI governance & compliance readiness assessment platform (NDMO, SDAIA, EU AI Act, GDPR, NIST AI RMF, ISO/IEC 42001)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Naga Leela Krishna Rajamahendravarapu" }]
keywords = ["ai-governance", "agentic-ai", "mcp", "rag", "compliance", "llm", "ndmo", "sdaia", "eu-ai-act"]

dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "PyJWT[crypto]>=2.8",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
]

[project.optional-dependencies]
# Real sentence-transformer embeddings + Chroma vector store.
# Everything works without these via the deterministic local fallback.
rag = ["chromadb>=0.5", "sentence-transformers>=3.0"]
pg = ["psycopg[binary]>=3.1"]
mcp = ["mcp>=1.2"]
otel = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp>=1.24"]
dev = [
  "pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.23",
  "ruff>=0.4", "mypy>=1.10", "bandit>=1.7", "pip-audit>=2.7",
  "types-PyYAML",
]

[project.scripts]
muraqib = "muraqib.cli:app"
muraqib-mcp = "muraqib.mcp.server:main"

[project.urls]
Homepage = "https://github.com/leelakrishna288/muraqib"
Source = "https://github.com/leelakrishna288/muraqib"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muraqib = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = ["integration: requires network or external services"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
# B008 flags function calls in argument defaults. For FastAPI `Depends(...)` and
# Typer `Option(...)`/`Argument(...)` that is the framework's required idiom, not
# a mutable-default bug. Scoped to the two modules that use those frameworks.
"src/muraqib/api/*" = ["B008"]
"src/muraqib/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
packages = ["muraqib"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src/muraqib"]
branch = true
