services:
  muraqib:
    build: .
    image: muraqib:1.0.0
    ports: ["8000:8000"]
    environment:
      MURAQIB_PROVIDER: ${MURAQIB_PROVIDER:-offline}
      MURAQIB_MODEL: ${MURAQIB_MODEL:-offline-deterministic}
      MURAQIB_AUTH_ENABLED: ${MURAQIB_AUTH_ENABLED:-0}
      MURAQIB_OIDC_ISSUER: ${MURAQIB_OIDC_ISSUER:-}
      MURAQIB_OIDC_AUDIENCE: ${MURAQIB_OIDC_AUDIENCE:-}
      MURAQIB_OIDC_JWKS_URI: ${MURAQIB_OIDC_JWKS_URI:-}
      MURAQIB_VECTOR_BACKEND: ${MURAQIB_VECTOR_BACKEND:-memory}
      MURAQIB_LOG_LEVEL: ${MURAQIB_LOG_LEVEL:-INFO}
      # API keys are passed through from the host environment only.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - muraqib-data:/app/data
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

  # Optional: Postgres + pgvector for a shared/team deployment.
  # Start with: docker compose --profile pg up
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["pg"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: muraqib
      POSTGRES_DB: muraqib
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muraqib"]
      interval: 10s
      retries: 5

volumes:
  muraqib-data:
  pgdata:
