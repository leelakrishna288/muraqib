name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy src/muraqib
      - name: Test with coverage
        # No API keys are configured. The whole suite runs on the deterministic
        # offline engine, so CI is hermetic and costs nothing.
        run: pytest --cov=src/muraqib --cov-report=xml --cov-report=term
      - name: Evaluation gate
        # Fails the build if grounding, abstention or over-claim rate regress.
        run: muraqib evaluate
      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - name: SAST (bandit)
        run: bandit -r src/muraqib -ll -f screen
      - name: Dependency audit (pip-audit)
        # Audit the resolved third-party dependency set, not the environment.
        # Auditing the environment made pip-audit report muraqib itself as
        # "not found on PyPI", which is a false positive - and a security job
        # that always warns is a security job everyone learns to ignore.
        run: |
          pip freeze --exclude-editable > /tmp/requirements.lock
          cat /tmp/requirements.lock
          pip-audit -r /tmp/requirements.lock --strict

  langgraph:
    name: langgraph backend equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install with the graph extra
        # The default `test` job deliberately does NOT install this. The
        # built-in orchestrator must keep working with no extra dependency, so
        # the equivalence tests skip there and run here.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,graph]"
      - name: Both executors must produce the same assessment
        # If this fails, one backend is carrying behaviour that belongs to the
        # pipeline rather than the executor.
        run: pytest tests/test_langgraph_backend.py -v
      - name: The full suite passes under the LangGraph executor too
        env:
          MURAQIB_ORCHESTRATOR: langgraph
        run: pytest -q
      - name: Evaluation gate under the LangGraph executor
        env:
          MURAQIB_ORCHESTRATOR: langgraph
        run: muraqib evaluate

  docker:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t muraqib:ci .
      - name: Corpus loads inside the image
        # This is the check that would have caught MURAQIB_CORPUS_DIR pointing one
        # directory too high: the service started, found no framework packs and
        # died, and only the health check noticed.
        run: |
          docker run --rm muraqib:ci muraqib frameworks | tee /dev/stderr | grep -q "Total controls: 121"
      - name: Runtime governance gates work inside the image
        run: |
          docker run --rm muraqib:ci python -c "
          from muraqib.runtime import GovernanceEngine, GovernancePolicy
          from muraqib.runtime.models import Principal, TransactionContext
          d = GovernanceEngine(GovernancePolicy.default()).evaluate(
              TransactionContext(principal=Principal(subject='x'), prompt='hi'))
          assert d.verdict.value == 'block', d.verdict
          print('unauthenticated request blocked at', d.blocked_at.value)
          "
      - name: Smoke test the service
        run: |
          docker run -d --name muraqib-ci -p 8000:8000 muraqib:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fs http://localhost:8000/health | grep -q '"controls":121'
          docker logs muraqib-ci
          docker rm -f muraqib-ci
