name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy src/muraqib
      - name: Test with coverage
        # No API keys are configured. The whole suite runs on the deterministic
        # offline engine, so CI is hermetic and costs nothing.
        run: pytest --cov=src/muraqib --cov-report=xml --cov-report=term
      - name: Evaluation gate
        # Fails the build if grounding, abstention or over-claim rate regress.
        run: muraqib evaluate
      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - name: SAST (bandit)
        run: bandit -r src/muraqib -ll -f screen
      - name: Dependency audit (pip-audit)
        run: pip-audit --strict || echo "::warning::pip-audit reported findings - review before release"

  docker:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t muraqib:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name muraqib-ci -p 8000:8000 muraqib:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          docker rm -f muraqib-ci
